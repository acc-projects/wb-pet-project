services:
    app:
        build:
            context: ./docker/fpm
            dockerfile: Dockerfile
            args:
                - USER_ID=1000
                - GROUP_ID=1000
        container_name: app
        volumes:
            - ./src:/var/www/myapp
            - ./docker/fpm/logs:/var/log
        networks:
            - app-network-test

    app-webserver:
        image: "nginx:stable-alpine"
        container_name: app-webserver
        ports:
            - "80:80"
            - "443:443"
        volumes:
            - ./docker/nginx/hosts/nginx.conf:/etc/nginx/conf.d/default.conf:ro
            - ./docker/nginx/logs:/var/log/nginx/mysite
            - ./src:/var/www/myapp
        networks:
            - app-network-test
        depends_on:
            - app
            - db

    cron:
        profiles: ["cron"]
        build:
            context: ./docker/fpm
            dockerfile: Dockerfile
            args:
                - USER_ID=1000
                - GROUP_ID=1000
        container_name: app-cron
        volumes:
            - ./src:/var/www/myapp
            - ./docker/cron/logs:/var/log/cron
            - ./docker/cron/crontab:/etc/cron.d
        entrypoint: [ ]
        command: [ "cron", "-f", "-L", "0" ]
        user: "root"
        networks:
            - app-network-test
        depends_on:
            - app
            - db
        restart: unless-stopped

    db:
        image: mysql:latest
        container_name: db
        ports:
            - "3316:3306"
        env_file:
            - ./env/mysql.env
        volumes:
            - ./docker/dbdata:/var/lib/mysql
        networks:
            - app-network-test

    composer:
        container_name: composer
        build:
            context: ./docker/composer
            dockerfile: Dockerfile
            args:
                - USER_ID=1000
                - GROUP_ID=1000
        user: "1000:1000"
        volumes:
            -   ./src:/var/www/myapp

    artisan:
        container_name: artisan
        build:
            context: ./docker/fpm
            dockerfile: Dockerfile
            args:
                - USER_ID=1000
                - GROUP_ID=1000
        volumes:
            - ./src:/var/www/myapp
        entrypoint: ["php", "/var/www/myapp/artisan"]
        user: "1000:1000"
        networks:
            - app-network-test

networks:
    app-network-test:
        driver: bridge